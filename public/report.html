<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Item - Lost & Found</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <div class="brand">Lost & Found</div>
      <nav class="nav-buttons">
        <a class="nav-link" href="/">Browse</a>
        <a class="nav-link active" href="/report">Report</a>
      </nav>
    </header>

    <main>
      <section class="panel panel-form">
        <div class="panel-header">
          <div>
            <h1>Report an item</h1>
            <p class="subtext">Submit a report and we will add it to the board.</p>
          </div>
        </div>

        <form id="reportForm" class="report-form">
          <label class="input-group">
            <span>I am reporting a</span>
            <div class="radio-row">
              <label><input type="radio" name="type" value="Lost" checked /> Lost Item</label>
              <label><input type="radio" name="type" value="Found" /> Found Item</label>
            </div>
          </label>

          <label class="input-group">
            <span>Item name *</span>
            <input type="text" name="name" placeholder="e.g. Black backpack, AirPods case..." required />
          </label>

          <label class="input-group">
            <span>Category</span>
            <select name="category">
              <option>Other</option>
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Books</option>
              <option>Accessories</option>
              <option>Sports</option>
              <option>Keys</option>
            </select>
          </label>

          <label class="input-group">
            <span>Location *</span>
            <input type="text" name="location" placeholder="e.g. Library, Room 204..." required />
          </label>

          <label class="input-group">
            <span>Description *</span>
            <textarea name="description" rows="4" placeholder="Color, size, identifying marks, brand, serial number..." required></textarea>
          </label>

          <label class="input-group">
            <span>Contact email *</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>

          <button class="submit-button" type="submit">Submit report</button>
          <div id="formMessage" class="form-message"></div>
        </form>
      </section>
    </main>
  </div>

  <script src="report.js"></script>
</body>
</html>
